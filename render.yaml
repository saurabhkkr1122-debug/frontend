services:
  - type: web
    name: mplads-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mplads-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: mplads-db
    plan: free
    databaseName: mplads
    user: mplads
    region: oregon